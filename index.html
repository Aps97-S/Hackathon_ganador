<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock & Crypto Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📈 Real-Time Stock & Crypto Tracker</h1>
        </header>

        <div class="main-content">
            <!-- Selection Panel -->
            <div class="selection-panel">
                <h2>Track Assets</h2>
                <div class="asset-selector">
                    <div class="asset-type">
                        <h3>Stocks</h3>
                        <select id="stockSelector" multiple>
                            <option value="AAPL">Apple (AAPL)</option>
                            <option value="GOOGL">Google (GOOGL)</option>
                            <option value="MSFT">Microsoft (MSFT)</option>
                            <option value="AMZN">Amazon (AMZN)</option>
                            <option value="TSLA">Tesla (TSLA)</option>
                        </select>
                    </div>
                    <div class="asset-type">
                        <h3>Cryptocurrencies</h3>
                        <select id="cryptoSelector" multiple>
                            <option value="BTC">Bitcoin (BTC)</option>
                            <option value="ETH">Ethereum (ETH)</option>
                            <option value="XRP">Ripple (XRP)</option>
                            <option value="LTC">Litecoin (LTC)</option>
                            <option value="ADA">Cardano (ADA)</option>
                        </select>
                    </div>
                </div>
                <button id="updateButton" class="btn-primary">Update Selection</button>
            </div>

            <!-- Tracker Panel -->
            <div class="tracker-panel">
                <h2>Live Tracking</h2>
                <div id="assetList" class="asset-list"></div>
                <div id="noAssetsMessage" class="no-assets-message">
                    No assets selected. Please choose assets to track.
                </div>
            </div>

            <!-- Alerts Panel -->
            <div class="alerts-panel">
                <h2>Alerts & Limits</h2>
                <div class="alert-controls">
                    <div class="limit-form">
                        <h3>Set Buy/Sell Limits</h3>
                        <div class="form-group">
                            <label for="selectedAsset">Select Asset:</label>
                            <select id="selectedAsset">
                                <option value="">-- Select an asset --</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="buyLimit">Buy Limit ($):</label>
                                <input type="number" id="buyLimit" placeholder="Enter buy limit">
                            </div>
                            <div class="form-group">
                                <label for="sellLimit">Sell Limit ($):</label>
                                <input type="number" id="sellLimit" placeholder="Enter sell limit">
                            </div>
                        </div>
                        <button id="setLimitsButton" class="btn-secondary">Set Limits</button>
                    </div>

                    <div class="alerts-list">
                        <h3>Active Alerts</h3>
                        <div id="alertsList" class="alerts-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
